name: 🚀 Accident Severity Predictor (ASP) CI

on:
  push:
    branches: [main, develop]

  pull_request:
    branches: [main, develop]

jobs:
  code-quality:
    uses: ./.github/workflows/asp-code-quality.yaml

  test-suite:
    needs: code-quality
    uses: ./.github/workflows/asp-test-suite.yaml

  container-build:
    needs: test-suite
    uses: ./.github/workflows/asp-container-build.yaml
